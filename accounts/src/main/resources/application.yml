server:
    port: 8080

spring:
  application:
    name: "accounts"
  profiles:
    active: "prod"
  datasource:
#    url: jdbc:h2:mem:testdb
#    driverClassName: org.h2.Driver
#    username: sa
#    password: ''
    url: ${MYSQL_HOST:jdbc:mysql://localhost:3306/accountsdb}
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:Hellgaze@123}
#  h2:
#    console:
#      enabled: true
  jpa:
#    database-platform: org.hibernate.dialect.H2Dialect
#    hibernate:
#      ddl-auto: update
    show-sql: true
  sql:
    init:
      mode: always
  config:
    import: "optional:configserver:http://localhost:8071/"
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
    function:
      definition: updateCommunication
    stream:
      bindings:
        updateCommunication-in-0:
          destination: communication-sent
          group: ${spring.application.name}
        sendCommuncation-out-0:
          destination: send-communication
      kafka:
        binder:
          brokers:
            - localhost:9092
#  rabbitmq:
#    host: "localhost"
#    port: 5672
#    username: "guest"
#    password: "guest"

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readiness-state:
      enabled: true
    liveness-state:
      enabled: true
  endpoint:
    shutdown:
      access: unrestricted
    health:
      probes:
        enabled: true
  info:
    env:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

eureka:
  instance:
    prefer-ip-address: true
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8070/eureka}

info:
  app:
    name: "accounts"
    version: "1.0.0"
    description: "Accounts Service Of Eazy Bank Application"
    build:
      version: "1.0.0"
      number: "1"
      time: "2022-04-18T00:00:00+05:30"

logging:
  level:
    com:
      ashish:
        accounts: DEBUG
  pattern:
    level: "%5p [${spring.application.name},%X{trace_id},%X{span_id}]"

resilience4j:
  circuitbreaker:
    configs:
      default:
        slidingWindowSize: 10
        permittedNumberOfCallsInHalfOpenState: 2
        failureRateThreshold: 50
        waitDurationInOpenState: 10000
  retry:
    configs:
      default:
        maxAttempts: 3
        waitDuration: 500
        enableExponentialBackoff: true
        ignoreExceptions:
          - java.lang.NullPointerException
        retryExceptions:
          - java.lang.RuntimeException

  ratelimiter:
    configs:
      default:
        timeoutDuration: 1000
        limitRefreshPeriod: 5000
        limitForPeriod: 1