services:
  accounts:
    image: accounts-service
    container_name: accounts-ms
    ports:
      - "8040:8040"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - eazybank
  loans:
    image: loans-service
    container_name: loans-ms
    ports:
      - "8041:8041"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - eazybank
  cards:
    image: cards-service
    container_name: cards-ms
    ports:
      - "9040:9040"
    deploy:
      resources:
        limits:
          memory: 700m
    networks:
      - eazybank
networks:
  eazybank:
    driver: "bridge"